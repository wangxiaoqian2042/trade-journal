name: Release

# 打 tag 即发布：0.5.2 → GitHub Release。
# 注意：tag 必须与 manifest.json 的版本完全一致，且不能带 v 前缀 —
# Obsidian 社区目录按 tag 精确匹配版本，v0.5.1 会被判定为「没有对应 release」。
on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag $GITHUB_REF_NAME 与 manifest.json 版本 $MANIFEST 不一致"
            exit 1
          fi

      - name: Pack zip for manual install
        run: ./scripts/pack-release.sh

      # 发布说明直接取自 CHANGELOG.md 的当前版本段落；缺了会在这里失败
      - name: Build release notes from CHANGELOG
        run: node scripts/release-notes.mjs > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            trade-journal-v*.zip
          body_path: release-notes.md
